name: Build Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install AutoIt via Chocolatey
        run: |
          choco install autoit --no-progress -y

      - name: Compile AutoIt Script
        run: |
          mkdir bin
          Aut2exe.exe /in "src\OpenCmdHere.au3" /out "bin\OpenCmdHere.exe" /x64

      - name: Inno Setup Action
        uses: Minionguyjpro/Inno-Setup-Action@v1.3.0
        with:
          path: setup.iss

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCmdHere-Installer
          path: Output/*.exe