name: Build & Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Chocolatey Packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Temp\chocolatey
          key: ${{ runner.os }}-choco-autoit-${{ hashFiles('src/OpenCmdHere.au3') }}
          restore-keys: |
            ${{ runner.os }}-choco-autoit-

      - name: Install AutoIt via Chocolatey
        run: |
          choco install autoit --no-progress -y

      - name: Compile AutoIt Script
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$PWD\bin"
          
          # Compile 64-bit binary directly
          & "C:\Program Files (x86)\AutoIt3\Aut2exe\Aut2exe.exe" /in "$PWD\src\OpenCmdHere.au3" /out "$PWD\bin\OpenCmdHere.exe" /x64

      - name: Extract Tag Version
        id: get_version
        shell: powershell
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v0.0.0-dev" }
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Compile Inno Setup Script
        uses: Minionguyjpro/Inno-Setup-Action@v1.3.0
        with:
          path: setup.iss
          options: /DMyAppVersion=${{ env.VERSION }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenCmdHere-Installer-${{ env.VERSION }}
          path: Output/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
          generate_release_notes: true