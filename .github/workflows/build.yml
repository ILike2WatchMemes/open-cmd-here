name: Build Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup AutoIt
        uses: ISAutoIt/setup-autoit@v1

      - name: Compile AutoIt Script
        run: |
          mkdir bin
          Aut2exe.exe /in "src\OpenCmdHere.au3" /out "bin\OpenCmdHere.exe" /x64

      - name: Build Inno Setup Installer
        uses: EngineSoftware/inno-setup-action@v1
        with:
          filepath: setup.iss

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCmdHere-Installer
          path: Output/*.exe