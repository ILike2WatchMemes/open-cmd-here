name: Build Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Chocolatey Packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Temp\chocolatey
          key: ${{ runner.os }}-choco-autoit-${{ hashFiles('src/OpenCmdHere.au3') }}
          restore-keys: |
            ${{ runner.os }}-choco-autoit-

      - name: Install AutoIt via Chocolatey
        run: |
          choco install autoit --no-progress -y

      - name: Compile AutoIt Script
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$PWD\bin"
          
          # Run Aut2exe directly to capture native stdout/stderr and exit codes
          & Aut2exe.exe /in "$PWD\src\OpenCmdHere.au3" /out "$PWD\bin\OpenCmdHere.exe" /x64
          
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$PWD\bin\OpenCmdHere.exe")) {
            Write-Error "AutoIt compilation failed."
            exit 1
          }

      - name: Extract Tag Version
        id: get_version
        shell: powershell
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v0.0.0-dev" }
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Compile Inno Setup Script
        uses: Minionguyjpro/Inno-Setup-Action@v1.3.0
        with:
          path: setup.iss
          options: /DMyAppVersion=${{ env.VERSION }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCmdHere-Installer-${{ env.VERSION }}
          path: Output/*.exe
          if-no-files-found: error